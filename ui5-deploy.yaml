#yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "2.6"
metadata:
  name: customer.app.variant.f1512
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: CNX_DEV_DS3_HTTPS_100
          url: http://vhfcxds3ci.sap.bara.mx:44300
          client: '100'
        app:
          name: ZENH_F1512
          description: Ampliación F1512
          package: ZMM_ABAP
          transport: DS3K903787
        exclude:
          - /test/
